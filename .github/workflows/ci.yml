name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
        timeout-minutes: 2

      - name: cargo fmt --check
        run: cargo fmt --all --check
        timeout-minutes: 2

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job; a cold run takes ~70s on a hosted runner.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 2

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3

      # cpal (sound) links against ALSA on Linux. Only Ubuntu's package lists are
      # fetched: the runner also lists packages.microsoft.com, which we don't
      # need, and its refusals failed the whole step (#717).
      - name: Install ALSA headers
        run: |
          ubuntu=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu"
          sudo apt-get update -o Acquire::Retries=3 -o Dir::Etc::sourcelist="$ubuntu" -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libasound2-dev
        timeout-minutes: 3

      # Compile separately so a slow build and a hung test get distinct limits.
      - name: Build tests
        run: cargo test --locked --no-run
        timeout-minutes: 6

      # Our crate is built at opt-level 2 for tests (Cargo.toml); the suite
      # then takes about two minutes (#613; unoptimized it takes far longer,
      # #377). Past this limit is a hang or a regression; a test that
      # runs over 60s is flagged in the log ("has been running for over").
      - name: Run tests
        run: cargo test --locked
        timeout-minutes: 4

  # The whole suite again, optimized. Some tests are too slow to mean anything
  # unoptimized (`maps_hardly_z_fight` takes minutes in debug, seconds here)
  # or time things, so they're `ignore`d under `debug_assertions` and only run
  # here. A separate job, so it builds alongside the debug one.
  release-test:
    name: Release-only tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 2

      - uses: Swatinem/rust-cache@v2
        with:
          key: release
        timeout-minutes: 3

      - name: Install ALSA headers
        run: |
          ubuntu=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$ubuntu"
          sudo apt-get update -o Acquire::Retries=3 -o Dir::Etc::sourcelist="$ubuntu" -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libasound2-dev
        timeout-minutes: 3

      - name: Build tests (release)
        run: cargo test --release --locked --no-run
        timeout-minutes: 12

      # The time cap: the whole optimized suite, slow tests included, takes
      # under three minutes (#714); past this it's a hang or a regression.
      # A test that builds whole maps costs seconds for each: use ones other
      # tests build (`procgen::map` keeps them), and few seeds.
      - name: Run tests (release)
        run: cargo test --release --locked
        timeout-minutes: 4
