name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
        timeout-minutes: 2

      - name: cargo fmt --check
        run: cargo fmt --all --check
        timeout-minutes: 2

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job; a cold run takes ~70s on a hosted runner.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 2

      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3

      # cpal (sound) links against ALSA on Linux.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
        timeout-minutes: 3

      # Compile separately so a slow build and a hung test get distinct limits.
      - name: Build tests
        run: cargo test --locked --no-run
        timeout-minutes: 6

      # Our crate is built at opt-level 2 for tests (Cargo.toml); the suite
      # then takes about two minutes (#613; unoptimized it takes far longer,
      # #377). Past this limit is a hang or a regression; a test that
      # runs over 60s is flagged in the log ("has been running for over").
      - name: Run tests
        run: cargo test --locked
        timeout-minutes: 4

  # The whole suite again, optimized. Some tests are too slow to mean anything
  # unoptimized (`maps_hardly_z_fight` takes minutes in debug, seconds here)
  # or time things, so they're `ignore`d under `debug_assertions` and only run
  # here. A separate job, so it builds alongside the debug one.
  release-test:
    name: Release-only tests (${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every test is in exactly one shard: the suite fills a runner's four
    # cores, so a second runner halves it (#714).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 2

      - uses: Swatinem/rust-cache@v2
        with:
          # (Both shards build the same thing.)
          shared-key: release
        timeout-minutes: 3

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
        timeout-minutes: 3

      - name: Build tests (release)
        run: cargo test --release --locked --no-run
        timeout-minutes: 12

      # The time cap: each shard, half the optimized suite, takes about two
      # minutes (#714); past this it's a hang or a regression. Every other
      # test goes in each, so a module's slow ones are shared out.
      - name: Run tests (release)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: |
          set -o pipefail
          cargo test --release --locked -- --list --format terse |
            sed -n 's/: test$//p' |
            awk -v k="$SHARD" -v n="$SHARDS" 'NR % n == k % n' > tests.txt
          test -s tests.txt
          mapfile -t tests < tests.txt
          cargo test --release --locked -- --exact "${tests[@]}"
        timeout-minutes: 4
