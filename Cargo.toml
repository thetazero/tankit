[package]
name = "tankit"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18"
dirs = "7.0.0"
env_logger = "0.11.11"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.35"
meshopt = "0.7"
pollster = "1.0.1"
rapier3d = "0.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30"
winit = "0.30"

# Physics and math crates optimised even in dev and test builds: unoptimised
# rapier made the physics tests (and the debug game) many times slower. Our own
# crate stays at opt-level 0, so it still builds fast and debugs well.
[profile.dev.package.rapier3d]
opt-level = 2
[profile.dev.package.parry3d]
opt-level = 2
[profile.dev.package.nalgebra]
opt-level = 2
[profile.dev.package.simba]
opt-level = 2
[profile.dev.package.wide]
opt-level = 2
[profile.dev.package.glamx]
opt-level = 2
[profile.dev.package.glam]
opt-level = 2
[profile.dev.package.meshopt]
opt-level = 2

# The tests build our own crate optimized too: unoptimized, the suite took over
# two minutes on CI (#377), at opt-level 1 nearly four on its slower runners
# (#613). `cargo build` and the debug game are untouched,
# and debug assertions and overflow checks stay on in tests.
[profile.test.package.tankit]
opt-level = 2
